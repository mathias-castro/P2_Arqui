<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 178" width="956" height="178" aria-label="Diagrama de pipeline">
<style>
  text { font-family: 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 14px; fill: #111; }
