<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proyecto 2 - Entrega final</title>
<style>
  @page { size: A4; margin: 2cm;
          @bottom-center { content: counter(page); font-family: Arial, "Liberation Sans", sans-serif; font-size: 9pt; } }
  @page portada { @bottom-center { content: none; } }
  @page apaisada { size: A4 landscape; margin: 1.2cm 1.2cm 1.5cm 1.2cm; }
  body { font-family: Arial, "Liberation Sans", sans-serif; font-size: 10pt; line-height: 1.38; color: #000; margin: 0; }
  p { text-align: justify; margin: 0 0 7pt 0; orphans: 3; widows: 3; }
  h1 { font-size: 14pt; margin: 14pt 0 6pt 0; break-after: avoid; }
  h2 { font-size: 12pt; margin: 14pt 0 6pt 0; break-after: avoid; }
  h3 { font-size: 10.5pt; margin: 10pt 0 5pt 0; break-after: avoid; }
  ul, ol { margin: 0 0 7pt 0; padding-left: 20pt; }
  li { text-align: justify; margin-bottom: 3pt; }
  code { font-family: "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 9.2pt; }
  pre { font-family: "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 8pt; line-height: 1.25;
        background: #f6f6f6; border: 0.6pt solid #c8c8c8; padding: 5pt 8pt; margin: 6pt 0 4pt 0;
        white-space: pre; overflow: hidden; break-inside: avoid; }
  table { border-collapse: collapse; margin: 6pt auto 4pt auto; font-size: 9.3pt; line-height: 1.25; break-inside: avoid; }
  th, td { border: 0.6pt solid #808080; padding: 2.2pt 5pt; text-align: left; vertical-align: top; }
  th { background: #e6e6e6; font-weight: bold; }
  td.c, th.c { text-align: center; }
  td.m { font-family: "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 8.4pt; white-space: nowrap; }
  tr.sep td { border-top: 1.3pt solid #404040; }
  tr.anul td { color: #808080; }
  .pie { text-align: center; font-size: 9.3pt; margin: 3pt 0 10pt 0; break-before: avoid; }
  figure { margin: 8pt 0 0 0; text-align: center; break-inside: avoid; }
  figure img, figure svg { max-width: 100%; }
  .portada { page: portada; text-align: center; break-after: page; height: 24.6cm; display: flex; flex-direction: column; align-items: center; }
  .portada .uni { font-size: 15pt; font-weight: bold; margin-top: 0.5cm; }
  .portada .curso { font-size: 13pt; margin-top: 8pt; }
  .portada img { width: 5.4cm; margin-top: 1.4cm; }
  .portada .ent { font-size: 17pt; font-weight: bold; margin-top: 1.4cm; }
  .portada .tit { font-size: 14pt; margin-top: 10pt; line-height: 1.35; }
  .portada .int { font-size: 12pt; margin-top: 2.2cm; line-height: 1.7; }
  .portada .fecha { font-size: 11pt; margin-top: auto; }
  .apaisada { page: apaisada; break-before: page; break-after: page; }
  .apaisada figure { margin: 0; }
  .apaisada img { width: auto; height: auto; max-width: 100%; max-height: 16.6cm; }
  .doble figure { margin: 0 0 4pt 0; }
  .doble img { max-height: 8.3cm; }
  .nuevo { break-before: page; }
</style>
</head>
<body>
